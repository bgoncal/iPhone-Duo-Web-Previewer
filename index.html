<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPhone Duo preview</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #1c1c1e; color: #e5e5ea; font: 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, Arial, sans-serif; }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  header { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 10px 16px; background: #2c2c2e; border-bottom: 1px solid #3a3a3c; }
  header label { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  header input[type=text] { padding: 5px 8px; border-radius: 6px; border: 1px solid #48484a; background: #1c1c1e; color: inherit; font: inherit; }
  #url { width: min(520px, 60vw); }
  header input[type=number] { width: 44px; padding: 4px 6px; border-radius: 6px; border: 1px solid #48484a; background: #1c1c1e; color: inherit; font: inherit; text-align: right; }
  header select, header button { padding: 5px 9px; border-radius: 6px; border: 1px solid #48484a; background: #3a3a3c; color: inherit; font: inherit; }
  header button { cursor: pointer; }
  header button.primary { background: #0a84ff; border-color: #0a84ff; color: #fff; }
  .row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; width: 100%; }
  .insets { gap: 6px; color: #8e8e93; }
  .spacer { flex: 1; }
  #status { color: #8e8e93; }
  #status.warn { color: #ffd60a; }
  #status a { color: #64d2ff; }
  main { flex: 1; display: grid; place-items: center; padding: 24px; overflow: auto; }
  #stage-scale { transform-origin: top center; }
  #stage { position: relative; width: 525px; height: 732px; }
  #screen { position: absolute; left: 29px; top: 27px; width: 466px; height: 678px; border: 0; background: #fff; border-radius: 0 28px 28px 0; }
  #placeholder { position: absolute; left: 29px; top: 27px; width: 466px; height: 678px; box-sizing: border-box; display: grid; place-items: center; text-align: center; padding: 32px; background: #000; color: #8e8e93; border-radius: 0 28px 28px 0; font-size: 15px; line-height: 1.5; }
  #placeholder[hidden] { display: none; }
  #frame { position: absolute; inset: 0; width: 525px; height: 732px; pointer-events: none; }
  #frame.no-indicators .indicators { display: none; }
</style>
</head>
<body>
<header>
  <div class="row">
    <label>URL
      <input id="url" type="text" placeholder="https://example.com or /lovelace/0" spellcheck="false" autocomplete="url" autofocus>
    </label>
    <button id="go" class="primary">Preview</button>
    <label>Frame
      <select id="preset"></select>
    </label>
    <label>Scale
      <select id="scale">
        <option value="1">100%</option>
        <option value="0.75">75%</option>
        <option value="0.5">50%</option>
      </select>
    </label>
  </div>
  <div class="row">
    <label><input id="insets" type="checkbox" checked> Inject safe areas</label>
    <span class="insets">
      T <input id="inset-top" type="number" min="0">
      R <input id="inset-right" type="number" min="0">
      B <input id="inset-bottom" type="number" min="0">
      L <input id="inset-left" type="number" min="0"> px
    </span>
    <label><input id="indicators" type="checkbox" checked> Show inset guides</label>
    <button id="copy" hidden>Copy inject snippet</button>
    <span class="spacer"></span>
    <span id="status"></span>
  </div>
</header>

  function resolveURL(raw) {
    let text = raw.trim();
    if (!text) return null;
    if (text.startsWith("/")) return new URL(text, location.origin);
    if (!/^[a-z][a-z0-9+.-]*:/i.test(text)) text = `https://${text}`;
    try { return new URL(text); } catch { return null; }
  }

  const isSameOrigin = (url) => url && location.origin !== "null" && url.origin === location.origin;

  function snippet() {
    const values = insets();
    const body = sides.map((side) => `s.setProperty('--app-safe-area-inset-${side}','${values[side]}px')`).join(";");
    return `(s=>{${body}})(document.documentElement.style)`;
  }

  function applyInsets() {
    if (!currentURL) return;
    let doc = null;
    try { doc = iframe.contentDocument; } catch {}
    if (!doc || !doc.documentElement) {
      setStatus(true,
        `${currentURL.origin} is cross-origin, so safe areas cannot be injected from here. Serve this page ` +
        `from that origin, or open DevTools, select the preview frame context and paste the inject snippet. ` +
        `A blank screen means the site refuses to be framed.`);
      $("copy").hidden = false;
      return;
    }
    $("copy").hidden = true;
    const style = doc.documentElement.style;
    const values = insets();
    for (const side of sides) {
      const name = `--app-safe-area-inset-${side}`;
      if ($("insets").checked) style.setProperty(name, `${values[side]}px`);
      else style.removeProperty(name);
    }
    const { width, height } = preset().screen;
    setStatus(false, `${width}×${height} · same-origin · insets ` +
      ($("insets").checked ? `T${values.top} R${values.right} B${values.bottom} L${values.left}` : "off"));
  }

  function setStatus(warn, text) {
    status.textContent = text;
    status.classList.toggle("warn", warn);
  }

  function layout() {
    const { screen } = preset();
    for (const el of [iframe, $("placeholder")]) {
      Object.assign(el.style, {
        left: `${screen.x}px`, top: `${screen.y}px`, width: `${screen.width}px`, height: `${screen.height}px`,
      });
    }
    const scale = Number($("scale").value);
    $("stage-scale").style.transform = `scale(${scale})`;
    $("stage-scale").style.height = `${732 * scale}px`;
    frame.classList.toggle("no-indicators", !$("indicators").checked);
  }

  function syncURL() {
    const values = insets();
    const next = new URLSearchParams({
      url: $("url").value.trim(),
      preset: $("preset").value,
      insets: $("insets").checked ? "1" : "0",
      indicators: $("indicators").checked ? "1" : "0",
      scale: $("scale").value,
      ...Object.fromEntries(sides.map((side) => [side, String(values[side])])),
    });
    history.replaceState(null, "", `${location.pathname}?${next}`);
  }

  function load() {
    const url = resolveURL($("url").value);
    if (!url) {
      currentURL = null;
      iframe.removeAttribute("src");
      $("placeholder").hidden = false;
      $("copy").hidden = true;
      setStatus(false, "");
      $("url").focus();
      return;
    }
    currentURL = url;
    $("placeholder").hidden = true;
    iframe.src = url.href;
    setStatus(false, `Loading ${url.host}…`);
    if (!isSameOrigin(url)) $("copy").hidden = false;
    syncURL();
  }

  iframe.addEventListener("load", applyInsets);
  $("go").addEventListener("click", load);
  $("url").addEventListener("keydown", (event) => { if (event.key === "Enter") load(); });
  $("insets").addEventListener("change", () => { applyInsets(); syncURL(); });
  for (const side of sides) $(`inset-${side}`).addEventListener("change", () => { applyInsets(); syncURL(); });
  $("indicators").addEventListener("change", () => { layout(); syncURL(); });
  $("scale").addEventListener("change", () => { layout(); syncURL(); });
  $("preset").addEventListener("change", () => { resetInsetInputs(); layout(); applyInsets(); syncURL(); });
  $("copy").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(snippet());
      $("copy").textContent = "Copied";
    } catch {
      prompt("Paste this in the preview frame's DevTools console:", snippet());
    }
    setTimeout(() => { $("copy").textContent = "Copy inject snippet"; }, 1500);
  });

  layout();
  load();
})();
</script>
</body>
</html>
